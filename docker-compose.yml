# Local development only. MongoDB is external (Atlas); no database container here.
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # File-watching fallback for bind mounts on Docker Desktop.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Keep container-installed deps and build cache out of the host bind mount.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:

